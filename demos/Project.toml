# Environment for the demo scripts. ROTIR itself deliberately does not depend on an AD
# backend or on the sampling stack (see the note in ../Project.toml), so those live here.
#
#   julia --project=demos -e 'using Pkg; Pkg.instantiate()'
#   julia --project=demos -t auto demos/rapid_rotator_betCas_nuts.jl
#
# `[sources]` needs Julia ≥ 1.11, which is ROTIR's minimum.

[deps]
AdvancedHMC = "0bf59076-c3b1-5ca4-86bd-e02cd72cde3d"
FiniteDifferences = "26cc04aa-876d-5657-8c51-4c34ba976000"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
LogDensityProblems = "6fdf6af0-433a-55f7-b3ed-c6c6e0b8df7c"
Pathfinder = "b1d3bc72-d0e7-4279-b92f-7fa5d6d2d454"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
PyCall = "438e738f-606a-5dbb-bf0a-cddfbfd45ab0"
PyPlot = "d330b81b-6aea-500a-939a-2ce795aea3ee"
ROTIR = "1effc416-1cd3-435e-ba3b-8cf647137d25"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Zygote = "e88e6eb3-aa80-5325-afca-941959d7151f"

[sources]
ROTIR = {path = ".."}

[compat]
AdvancedHMC = "0.8.6"
FiniteDifferences = "0.12.34"
LogDensityProblems = "2.2.0"
Pathfinder = "0.9.31"
Zygote = "0.7.11"
julia = "1.11"
